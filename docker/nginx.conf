# Serves the Flutter web build (Dockerfile stage `web`). See SPEC-devops.md, AC-OPS-7.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # `always` sends the headers on every status code, not only 2xx/3xx.
    # CanvasKit is served from this image (--no-web-resources-cdn), so scripts stay 'self';
    # 'wasm-unsafe-eval' lets the browser compile CanvasKit's WebAssembly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # go_router paths such as /journal/42 have no file, so they fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
