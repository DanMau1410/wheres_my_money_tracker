# Quality gate for every PR into dev or main (SPEC-devops.md). The job name `flutter` is a
# required check in the rulesets, so it never changes. No secrets: PRs from forks run this too.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan
        run: sh tool/secret_scan.sh

      - name: Pin check
        run: sh tool/check_pins.sh

      # The title becomes the squash commit on dev. It goes through env, never into the script.
      - name: PR title follows Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::PR title must look like 'type(scope): summary', for example 'build(devops): add the CI workflow'"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No GitHub Actions layer cache: a runner builds the toolchain in about 1.5 min, while uploading
      # the cache took 5–11 min per run (PR #4). The web build below reuses this builder's layers.
      # The report goes outside the checkout: a file in the build context would make the next
      # build's `COPY . .` miss and run the whole gate again.
      - name: Quality gate (format, analyze, tests, coverage, web and APK builds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci-report
          outputs: type=local,dest=${{ runner.temp }}/ci-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/ci-report/lcov.info
          if-no-files-found: error

      - name: Build the web image (staging config)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: wmmt-web:ci
          build-args: APP_ENV=staging

      - name: Smoke test the web image
        run: |
          docker run --rm -d -p 8080:8080 --name wmmt-web wmmt-web:ci
          sh tool/smoke_web.sh http://localhost:8080
